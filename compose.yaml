services:
  capture:
    build: ./capture
    environment:
      SCREENSHOT_TOKEN: ${SCREENSHOT_TOKEN:?set SCREENSHOT_TOKEN}
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    shm_size: 256mb
    restart: unless-stopped
  scheduler: &scheduler
    image: node:24-bookworm-slim
    environment:
      BENCH_URL: ${BENCH_URL:?set BENCH_URL}
      SITES_ACCESS_TOKEN: ${SITES_ACCESS_TOKEN:?set SITES_ACCESS_TOKEN}
      RUN_TOKEN: ${RUN_TOKEN:?set RUN_TOKEN}
    volumes:
      - ./scripts/run-watchlists.mjs:/app/run-watchlists.mjs:ro
    command: ["sh", "-c", "while true; do node /app/run-watchlists.mjs discovery; sleep 60; done"]
    restart: unless-stopped
  scheduler-reconciliation:
    <<: *scheduler
    command: ["sh", "-c", "while true; do node /app/run-watchlists.mjs reconciliation; sleep 60; done"]
  scheduler-evidence:
    <<: *scheduler
    command: ["sh", "-c", "while true; do node /app/run-watchlists.mjs evidence; sleep 60; done"]
  scheduler-alerts:
    <<: *scheduler
    command: ["sh", "-c", "while true; do node /app/run-watchlists.mjs alerts; sleep 60; done"]
  alerts:
    profiles: ["alerts"]
    build: ./alerts
    environment:
      ALERT_GATEWAY_TOKEN: ${ALERT_GATEWAY_TOKEN:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ALERT_FROM_EMAIL: ${ALERT_FROM_EMAIL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      MOBILE_RECIPIENTS_JSON: ${MOBILE_RECIPIENTS_JSON:-}
      ALERT_LEDGER_DIR: /data
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - alert-ledger:/data
    restart: unless-stopped
volumes:
  alert-ledger:
